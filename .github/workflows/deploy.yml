name: Deploy to production

on:
  # Trigger on push to master
  push:
    branches: [master]
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  # Only 1 deploy at a time, cancel previous if a new push arrives
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # Fail fast + verbose command output
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /home/deploy/apps/yugioh

            echo "▶ Pulling latest code..."
            # server/dist/ est gitignore mais les anciens deploys ont
            # committe des artefacts en local sur le VPS — ils bloquent le
            # pull ("would be overwritten by merge"). On les jarte avant.
            git checkout -- . 2>/dev/null || true
            git clean -fd server/dist client/dist 2>/dev/null || true
            git pull origin master

            echo "▶ Installing server deps..."
            cd server && npm ci

            # better-sqlite3 ET bcrypt sont des modules natifs : leur .node
            # binaire doit etre compile pour la version Node du VPS. Sans ca,
            # cardStore.ts (better-sqlite3) ou authController (bcrypt) throw
            # au chargement, PM2 restart en boucle, et nginx renvoie 502 sur
            # tout. npm ci lance normalement le postinstall, mais si
            # build-essential manque il fail silencieusement — on force ici
            # avec fallback.
            echo "▶ Rebuilding native bindings (better-sqlite3, bcrypt)..."
            npm rebuild better-sqlite3 || npm install better-sqlite3 --build-from-source
            npm rebuild bcrypt || npm install bcrypt --build-from-source

            echo "▶ Compiling backend TypeScript..."
            npx tsc

            echo "▶ Ensuring duel engine assets..."
            # cards.cdb (~15 Mo) + scripts Lua ProjectIgnis (~50 Mo, clone git).
            # Sans ces assets, tout appel a l'engine plante "moteur non installe".
            # Idempotent : ne re-telecharge que si absent, git pull sinon.
            if [ ! -f assets/duel/cards.cdb ] || [ ! -d assets/duel/scripts/.git ]; then
              npx ts-node scripts/fetchDuelAssets.ts || echo "⚠ fetchDuelAssets a echoue — le duel ne fonctionnera pas"
            fi

            echo "▶ Installing client deps..."
            cd ../client && npm ci

            echo "▶ Building frontend..."
            npm run build

            echo "▶ Running SQL migrations..."
            cd ..
            for f in server/src/config/migrations/*.sql; do
              echo "  → $f"
              PGPASSWORD='${{ secrets.DB_PASSWORD }}' psql \
                -U yugioh -h localhost -d yugioh_collection -f "$f"
            done

            echo "▶ Restarting PM2..."
            pm2 restart yugioh-api
            pm2 save

            echo "✅ Deploy complete: $(git rev-parse --short HEAD)"
