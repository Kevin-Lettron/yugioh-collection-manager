<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejoindre le Sanctuaire · Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Tokens (identiques) */
:root {
  --bg-0: #050307;
  --bg-1: #0B0813;
  --bg-2: #14101C;
  --panel: #1A1424;
  --panel-2: #22182F;
  --border: #3A2B4C;
  --border-gold: #4A3C1E;
  --text: #F5EFE0;
  --text-muted: #A99C86;
  --text-dim: #6B5E45;
  --gold: #F5C518;
  --gold-dim: #C29A0F;
  --gold-glow: rgba(245, 197, 24, 0.35);
  --violet: #A855F7;
  --violet-glow: rgba(168, 85, 247, 0.35);
  --cyan: #22D3EE;
  --magenta: #FF2E88;
  --success: #34D399;
  --danger: #FF4D6D;
  --grid: rgba(245, 197, 24, 0.06);
  --hieroglyph: rgba(168, 85, 247, 0.04);
  --easing: cubic-bezier(.2, .8, .2, 1);
  --duration-fast: 180ms;
  --duration-mid: 320ms;
  --duration-slow: 600ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background-color: var(--bg-0);
  color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse 60% 50% at 50% 30%, rgba(168, 85, 247, 0.28), transparent 60%),
    radial-gradient(ellipse 40% 40% at 70% 100%, rgba(245, 197, 24, 0.12), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 50%, var(--bg-0));
  background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px, 100% 100%;
  background-attachment: fixed;
  display: grid;
  place-items: center;
  padding: 40px 20px;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
  animation: grain 8s steps(6) infinite;
}
@keyframes grain {
  0%,100% { transform: translate(0,0); }
  16% { transform: translate(-3%, -1%); }
  33% { transform: translate(2%, 3%); }
  50% { transform: translate(-2%, 2%); }
  66% { transform: translate(3%, -2%); }
  83% { transform: translate(-1%, 3%); }
}
@media (prefers-reduced-motion: reduce) { body::after { animation: none; } }

/* Parallax layers */
.parallax-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; will-change: transform; }
.glyph { position: absolute; color: var(--violet); opacity: 0.12; animation: float 12s ease-in-out infinite; }
.glyph.gold { color: var(--gold); opacity: 0.09; }
.glyph.delay-1 { animation-delay: -2s; }
.glyph.delay-2 { animation-delay: -5s; }
.glyph.delay-3 { animation-delay: -8s; }
@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%     { transform: translateY(-30px) rotate(6deg); }
}
@media (prefers-reduced-motion: reduce) { .glyph { animation: none; } }

/* Corner ornaments */
.corner-ornament {
  position: fixed;
  width: 120px;
  height: 120px;
  pointer-events: none;
  z-index: 10;
  color: var(--gold);
  opacity: 0.45;
  animation: cornerPulse 4s ease-in-out infinite;
}
.corner-ornament.tl { top: 12px; left: 12px; }
.corner-ornament.tr { top: 12px; right: 12px; transform: scaleX(-1); }
.corner-ornament.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
.corner-ornament.br { bottom: 12px; right: 12px; transform: scale(-1); }
@keyframes cornerPulse {
  0%,100% { opacity: 0.35; filter: drop-shadow(0 0 0 var(--gold-glow)); }
  50%     { opacity: 0.55; filter: drop-shadow(0 0 8px var(--gold-glow)); }
}
@media (prefers-reduced-motion: reduce) { .corner-ornament { animation: none; } }

.home-link {
  position: fixed;
  top: 28px;
  left: 60px;
  z-index: 50;
  color: var(--text-muted);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color var(--duration-fast) var(--easing);
}
.home-link:hover { color: var(--gold); }
.home-link::before { content: '←'; }

/* AUTH */
.auth-wrap {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: authIn 700ms var(--easing) both;
}
@keyframes authIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .auth-wrap { animation: none; } }

.auth-logo {
  width: 120px;
  height: 120px;
  color: var(--gold);
  margin-bottom: -30px;
  z-index: 6;
  filter: drop-shadow(0 0 30px var(--gold-glow));
  animation: logoBreath 5s ease-in-out infinite;
  position: relative;
}
.auth-logo::after {
  content: '';
  position: absolute;
  inset: -30px;
  border: 1px dashed var(--border-gold);
  border-radius: 50%;
  opacity: 0.5;
  animation: logoRing 12s linear infinite;
}
@keyframes logoBreath {
  0%,100% { filter: drop-shadow(0 0 20px var(--gold-glow)); transform: translateY(0); }
  50%     { filter: drop-shadow(0 0 40px rgba(245,197,24,0.6)); transform: translateY(-4px); }
}
@keyframes logoRing {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .auth-logo, .auth-logo::after { animation: none; }
}

.auth-card {
  width: 100%;
  padding: 70px 44px 44px;
  background: linear-gradient(160deg, var(--panel), var(--bg-1));
  border: 1px solid var(--border);
  clip-path: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.auth-card::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px dashed var(--border-gold);
  clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px));
  pointer-events: none;
  opacity: 0.4;
}

.auth-eyebrow {
  display: block;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.auth-title {
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
  background: linear-gradient(180deg, var(--text), var(--gold-dim));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.15;
}
.auth-sub {
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 32px;
  letter-spacing: 0.02em;
}

.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  color: var(--text-dim);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}

.field { margin-bottom: 18px; }
.field-label {
  display: block;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding-left: 4px;
}
.field-input {
  width: 100%;
  padding: 14px 18px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  letter-spacing: 0.02em;
  outline: none;
  transition: all var(--duration-fast) var(--easing);
}
.field-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15), 0 0 20px var(--gold-glow);
  background: var(--panel);
}
.field-input::placeholder {
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  letter-spacing: 0.05em;
}

/* Password strength meter */
.pw-meter {
  margin-top: 10px;
  display: grid;
  gap: 6px;
}
.pw-bars {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  height: 4px;
}
.pw-bar {
  background: var(--border);
  transition: background var(--duration-fast) var(--easing);
}
.pw-bar.on-1 { background: var(--danger); }
.pw-bar.on-2 { background: #FBBF24; }
.pw-bar.on-3 { background: var(--gold); }
.pw-bar.on-4 { background: var(--success); box-shadow: 0 0 8px rgba(52,211,153,0.5); }

.pw-hints {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 12px;
  color: var(--text-dim);
  padding-top: 4px;
}
.pw-hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.04em;
  transition: color var(--duration-fast) var(--easing);
}
.pw-hint::before {
  content: '○';
  color: var(--text-dim);
  font-size: 10px;
}
.pw-hint.ok { color: var(--success); }
.pw-hint.ok::before { content: '✓'; color: var(--success); }

/* Consent checkbox */
.consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-top: 10px;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: 0.02em;
  cursor: pointer;
}
.consent input {
  appearance: none;
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 2px;
  border: 1px solid var(--gold);
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
}
.consent input:checked { background: var(--gold); }
.consent input:checked::after {
  content: '✓';
  color: var(--bg-0);
  font-size: 12px;
  font-weight: 900;
}
.consent a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.consent a:hover { color: var(--text); }

/* Cyber button */
.cyber-btn {
  --main: var(--gold);
  --shadow: var(--violet);
  --fg: #0B0906;
  --clip: polygon(0 0, 100% 0, 100% 100%, 95% 100%, 95% 90%, 85% 90%, 85% 100%, 8% 100%, 0 70%);
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 28px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  letter-spacing: 0.16em;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--fg);
  background: transparent;
  border: 0;
  cursor: pointer;
  min-height: 52px;
  transition: transform var(--duration-fast) var(--easing), filter var(--duration-mid) var(--easing);
  margin-top: 20px;
  width: 100%;
}
.cyber-btn::before, .cyber-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  clip-path: var(--clip);
  z-index: -1;
}
.cyber-btn::before {
  background: var(--shadow);
  transform: translateX(5px);
}
.cyber-btn::after { background: var(--main); }
.cyber-btn:hover { filter: brightness(1.1); }
.cyber-btn:active { transform: translate(2px, 1px); }
.cyber-btn.glitch:hover::after { animation: glitch 0.6s steps(4) infinite; }
@keyframes glitch {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-1px, 1px); filter: hue-rotate(15deg); }
  50%  { transform: translate(1px, -1px); }
  75%  { transform: translate(-1px, -1px); filter: hue-rotate(-15deg); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .cyber-btn.glitch:hover::after { animation: none; }
}

.auth-bottom {
  text-align: center;
  margin-top: 28px;
  color: var(--text-muted);
  font-size: 14px;
}
.auth-bottom a {
  color: var(--gold);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  margin-left: 6px;
  border-bottom: 1px solid var(--gold-dim);
  padding-bottom: 2px;
  transition: color var(--duration-fast) var(--easing);
}
.auth-bottom a:hover { color: var(--text); border-color: var(--gold); }

.auth-sigil {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.2em;
  opacity: 0.8;
}
.auth-sigil svg { width: 14px; height: 14px; color: var(--gold-dim); }
.auth-sigil::before, .auth-sigil::after {
  content: '';
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}

@media (max-width: 720px) {
  .corner-ornament { width: 60px; height: 60px; }
  .auth-card { padding: 60px 24px 32px; }
  .auth-logo { width: 90px; height: 90px; }
  .home-link { top: 16px; left: 20px; }
  .pw-hints { font-size: 11px; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-millennium" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="miter">
    <path d="M4 4 L28 4 L16 29 Z"/>
    <path d="M9 10 L23 10 L16 24 Z" stroke-width="0.8" opacity="0.55"/>
    <ellipse cx="16" cy="13" rx="5.4" ry="3.1" stroke-width="1.3"/>
    <circle cx="16" cy="13" r="1.7" fill="currentColor" stroke="none"/>
    <path d="M16 16.5 L16 20 M13 16 L11.5 19 M19 16 L20.5 19" stroke-width="0.9"/>
  </symbol>
  <symbol id="i-corner" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M0 0 L60 0 L60 4 L4 4 L4 60 L0 60 Z"/>
    <path d="M10 10 L44 10 M10 10 L10 44" opacity="0.4"/>
    <path d="M20 20 L34 20 L34 24 L24 24 L24 34 L20 34 Z" opacity="0.7"/>
    <circle cx="12" cy="52" r="2" fill="currentColor"/>
    <circle cx="52" cy="12" r="2" fill="currentColor"/>
    <path d="M60 60 L70 60 L70 62 L62 62 L62 70 L60 70 Z" opacity="0.3"/>
  </symbol>
  <symbol id="i-glyph-eye" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5">

    <path d="M20 4 L20 32" opacity="0.5"/>
    <path d="M10 22 L30 22" opacity="0.4"/>
  </symbol>
</svg>

<svg class="corner-ornament tl"><use href="#i-corner"/></svg>
<svg class="corner-ornament tr"><use href="#i-corner"/></svg>
<svg class="corner-ornament bl"><use href="#i-corner"/></svg>
<svg class="corner-ornament br"><use href="#i-corner"/></svg>

<div class="parallax-layer" data-depth="0.15">
  <svg class="glyph gold" style="top:6%; left:8%; width:200px; height:200px;"><use href="#i-glyph-pyramid"/></svg>
  <svg class="glyph delay-1" style="top:14%; right:6%; width:180px; height:180px;"><use href="#i-glyph-eye"/></svg>
  <svg class="glyph gold delay-2" style="bottom:8%; left:12%; width:150px; height:150px;"><use href="#i-glyph-ankh"/></svg>
  <svg class="glyph delay-3" style="bottom:12%; right:10%; width:170px; height:170px;"><use href="#i-glyph-pyramid"/></svg>
</div>
<div class="parallax-layer" data-depth="0.32">
  <svg class="glyph delay-2" style="top:34%; left:26%; width:70px; height:70px;"><use href="#i-glyph-eye"/></svg>
  <svg class="glyph gold delay-1" style="top:72%; right:26%; width:80px; height:80px;"><use href="#i-glyph-ankh"/></svg>
</div>

<a href="maquette-v2-web-home.html" class="home-link">Retour au sanctuaire</a>

<div class="auth-wrap">
  <svg class="auth-logo" viewBox="0 0 32 32"><use href="#i-millennium"/></svg>

  <div class="auth-card">
    <span class="auth-eyebrow">— Rituel d'initiation —</span>
    <h1 class="auth-title">Rejoindre<br>le Sanctuaire</h1>
    <p class="auth-sub">Trente secondes. Aucune carte bancaire. Ta place t'attend.</p>

    <form onsubmit="event.preventDefault();">
      <div class="field">
        <label class="field-label" for="username">Nom de duelliste</label>
        <input class="field-input" id="username" type="text" placeholder="Ex. YugiBoy_92" autocomplete="username">
      </div>

      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" id="email" type="email" placeholder="pharaon@sanctuaire.io" autocomplete="email">
      </div>

      <div class="field">
        <label class="field-label" for="password">Sceau secret</label>
        <input class="field-input" id="password" type="password" placeholder="12 caractères minimum" autocomplete="new-password">
        <div class="pw-meter" id="pw-meter">
          <div class="pw-bars">
            <div class="pw-bar" data-bar="1"></div>
            <div class="pw-bar" data-bar="2"></div>
            <div class="pw-bar" data-bar="3"></div>
            <div class="pw-bar" data-bar="4"></div>
          </div>
          <div class="pw-hints">
            <span class="pw-hint" data-rule="len">12 caractères</span>
            <span class="pw-hint" data-rule="up">1 majuscule</span>
            <span class="pw-hint" data-rule="num">1 chiffre</span>
            <span class="pw-hint" data-rule="sym">1 symbole</span>
          </div>
        </div>
      </div>

      <label class="consent">
        <input type="checkbox">
        <span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a> du Sanctuaire.</span>
      </label>

      <button class="cyber-btn glitch" type="submit">
        Rejoindre le Sanctuaire
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="auth-bottom">
      Déjà un compte ?
      <a href="maquette-v2-web-login.html">Se connecter</a>
    </div>
  </div>

  <div class="auth-sigil">
    <svg><use href="#i-glyph-ankh"/></svg>
    Ton grimoire, ta règle
    <svg><use href="#i-glyph-ankh"/></svg>
  </div>
</div>

<script>
const layers = document.querySelectorAll('.parallax-layer');
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!prefersReduced) {
  let mx = 0, my = 0, ticking = false;
  addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - 0.5) * 30;
    my = (e.clientY / innerHeight - 0.5) * 30;
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      layers.forEach(l => {
        const d = parseFloat(l.dataset.depth || 0.2);
        l.style.transform = `translate3d(${mx * d}px, ${my * d}px, 0)`;
      });
      ticking = false;
    });
  });
}

// Password strength
const pwEl = document.getElementById('password');
const bars = document.querySelectorAll('.pw-bar');
const hints = document.querySelectorAll('.pw-hint');
pwEl.addEventListener('input', () => {
  const v = pwEl.value;
  const rules = {
    len: v.length >= 12,
    up:  /[A-Z]/.test(v),
    num: /[0-9]/.test(v),
    sym: /[^A-Za-z0-9]/.test(v),
  };
  hints.forEach(h => {
    const r = h.dataset.rule;
    h.classList.toggle('ok', rules[r]);
  });
  const score = Object.values(rules).filter(Boolean).length;
  bars.forEach((b, i) => {
    b.className = 'pw-bar';
    if (i < score) b.classList.add('on-' + score);
  });
});
</script>
