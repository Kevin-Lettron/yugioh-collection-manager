<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Sanctuaire du Millénium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Tokens */
:root {
  --bg-0: #050307;
  --bg-1: #0B0813;
  --bg-2: #14101C;
  --panel: #1A1424;
  --panel-2: #22182F;
  --border: #3A2B4C;
  --border-gold: #4A3C1E;
  --text: #F5EFE0;
  --text-muted: #A99C86;
  --text-dim: #6B5E45;
  --gold: #F5C518;
  --gold-dim: #C29A0F;
  --gold-glow: rgba(245, 197, 24, 0.35);
  --violet: #A855F7;
  --violet-glow: rgba(168, 85, 247, 0.35);
  --cyan: #22D3EE;
  --magenta: #FF2E88;
  --success: #34D399;
  --danger: #FF4D6D;
  --grid: rgba(245, 197, 24, 0.06);
  --hieroglyph: rgba(168, 85, 247, 0.04);
  --easing: cubic-bezier(.2, .8, .2, 1);
  --duration-fast: 180ms;
  --duration-mid: 320ms;
  --duration-slow: 600ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100vh;
  background-color: var(--bg-0);
  color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif;
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(ellipse 60% 50% at 50% 30%, rgba(168, 85, 247, 0.28), transparent 60%),
    radial-gradient(ellipse 40% 40% at 30% 100%, rgba(245, 197, 24, 0.1), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg, var(--bg-0), var(--bg-1) 50%, var(--bg-0));
  background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px, 100% 100%;
  background-attachment: fixed;
  display: grid;
  place-items: center;
  padding: 40px 20px;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.05;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
  animation: grain 8s steps(6) infinite;
}
@keyframes grain {
  0%,100% { transform: translate(0,0); }
  16% { transform: translate(-3%, -1%); }
  33% { transform: translate(2%, 3%); }
  50% { transform: translate(-2%, 2%); }
  66% { transform: translate(3%, -2%); }
  83% { transform: translate(-1%, 3%); }
}
@media (prefers-reduced-motion: reduce) {
  body::after { animation: none; }
}

/* Parallax glyphes GROS (l'auth doit être immersive) */
.parallax-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  will-change: transform;
}
.glyph {
  position: absolute;
  color: var(--violet);
  opacity: 0.12;
  animation: float 12s ease-in-out infinite;
}
.glyph.gold { color: var(--gold); opacity: 0.09; }
.glyph.delay-1 { animation-delay: -2s; }
.glyph.delay-2 { animation-delay: -5s; }
.glyph.delay-3 { animation-delay: -8s; }
@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%     { transform: translateY(-30px) rotate(6deg); }
}
@media (prefers-reduced-motion: reduce) { .glyph { animation: none; } }

/* Corner ornaments */
.corner-ornament {
  position: fixed;
  width: 120px;
  height: 120px;
  pointer-events: none;
  z-index: 10;
  color: var(--gold);
  opacity: 0.45;
  animation: cornerPulse 4s ease-in-out infinite;
}
.corner-ornament.tl { top: 12px; left: 12px; }
.corner-ornament.tr { top: 12px; right: 12px; transform: scaleX(-1); }
.corner-ornament.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
.corner-ornament.br { bottom: 12px; right: 12px; transform: scale(-1); }
@keyframes cornerPulse {
  0%,100% { opacity: 0.35; filter: drop-shadow(0 0 0 var(--gold-glow)); }
  50%     { opacity: 0.55; filter: drop-shadow(0 0 8px var(--gold-glow)); }
}
@media (prefers-reduced-motion: reduce) { .corner-ornament { animation: none; } }

/* Home link petit en haut à gauche */
.home-link {
  position: fixed;
  top: 28px;
  left: 60px;
  z-index: 50;
  color: var(--text-muted);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color var(--duration-fast) var(--easing);
}
.home-link:hover { color: var(--gold); }
.home-link::before { content: '←'; }

/* ═══════════════════════════════════════════════════════════════════════════
   AUTH CARD
   ═══════════════════════════════════════════════════════════════════════════ */
.auth-wrap {
  position: relative;
  z-index: 5;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: authIn 700ms var(--easing) both;
}
@keyframes authIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .auth-wrap { animation: none; } }

.auth-logo {
  width: 120px;
  height: 120px;
  color: var(--gold);
  margin-bottom: -30px;
  z-index: 6;
  filter: drop-shadow(0 0 30px var(--gold-glow));
  animation: logoBreath 5s ease-in-out infinite;
  position: relative;
}
.auth-logo::after {
  content: '';
  position: absolute;
  inset: -30px;
  border: 1px dashed var(--border-gold);
  border-radius: 50%;
  opacity: 0.5;
  animation: logoRing 12s linear infinite;
}
@keyframes logoBreath {
  0%,100% { filter: drop-shadow(0 0 20px var(--gold-glow)); transform: translateY(0); }
  50%     { filter: drop-shadow(0 0 40px rgba(245,197,24,0.6)); transform: translateY(-4px); }
}
@keyframes logoRing {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .auth-logo { animation: none; }
  .auth-logo::after { animation: none; }
}

.auth-card {
  width: 100%;
  padding: 70px 44px 44px;
  background: linear-gradient(160deg, var(--panel), var(--bg-1));
  border: 1px solid var(--border);
  clip-path: polygon(0 20px, 20px 0, calc(100% - 20px) 0, 100% 20px, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.auth-card::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 1px dashed var(--border-gold);
  clip-path: polygon(0 16px, 16px 0, calc(100% - 16px) 0, 100% 16px, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px));
  pointer-events: none;
  opacity: 0.4;
}

.auth-eyebrow {
  display: block;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.auth-title {
  text-align: center;
  font-family: 'Orbitron', sans-serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 8px;
  background: linear-gradient(180deg, var(--text), var(--gold-dim));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.auth-sub {
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
  margin-bottom: 36px;
  letter-spacing: 0.02em;
}

/* Divider stylé */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 20px 0;
  color: var(--text-dim);
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}

/* Form fields */
.field {
  margin-bottom: 20px;
}
.field-label {
  display: block;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding-left: 4px;
}
.field-input {
  width: 100%;
  padding: 14px 18px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  letter-spacing: 0.02em;
  outline: none;
  transition: all var(--duration-fast) var(--easing);
}
.field-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(245, 197, 24, 0.15), 0 0 20px var(--gold-glow);
  background: var(--panel);
}
.field-input::placeholder {
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  letter-spacing: 0.05em;
}

.field-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  font-size: 13px;
}
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  cursor: pointer;
}
.remember input {
  appearance: none;
  width: 16px;
  height: 16px;
  border: 1px solid var(--gold);
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  clip-path: polygon(0 0, 100% 0, 100% 70%, 70% 100%, 0 100%);
}
.remember input:checked { background: var(--gold); }
.remember input:checked::after {
  content: '✓';
  color: var(--bg-0);
  font-size: 12px;
  font-weight: 900;
}
.forgot {
  color: var(--gold-dim);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: color var(--duration-fast) var(--easing);
}
.forgot:hover { color: var(--gold); }

/* Cyber button block */
.cyber-btn {
  --main: var(--gold);
  --shadow: var(--violet);
  --fg: #0B0906;
  --clip: polygon(0 0, 100% 0, 100% 100%, 95% 100%, 95% 90%, 85% 90%, 85% 100%, 8% 100%, 0 70%);
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 28px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  letter-spacing: 0.16em;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--fg);
  background: transparent;
  border: 0;
  cursor: pointer;
  min-height: 52px;
  transition: transform var(--duration-fast) var(--easing), filter var(--duration-mid) var(--easing);
  margin-top: 12px;
  width: 100%;
}
.cyber-btn::before, .cyber-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  clip-path: var(--clip);
  z-index: -1;
}
.cyber-btn::before {
  background: var(--shadow);
  transform: translateX(5px);
}
.cyber-btn::after { background: var(--main); }
.cyber-btn:hover { filter: brightness(1.1); }
.cyber-btn:active { transform: translate(2px, 1px); }
.cyber-btn.glitch:hover::after { animation: glitch 0.6s steps(4) infinite; }
@keyframes glitch {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-1px, 1px); filter: hue-rotate(15deg); }
  50%  { transform: translate(1px, -1px); }
  75%  { transform: translate(-1px, -1px); filter: hue-rotate(-15deg); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .cyber-btn.glitch:hover::after { animation: none; }
}

/* SSO buttons */
.sso-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}
.sso-btn {
  padding: 12px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all var(--duration-fast) var(--easing);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 8px 100%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.sso-btn:hover { border-color: var(--gold-dim); color: var(--text); }
.sso-btn svg { width: 16px; height: 16px; }

/* Bottom link */
.auth-bottom {
  text-align: center;
  margin-top: 32px;
  color: var(--text-muted);
  font-size: 14px;
}
.auth-bottom a {
  color: var(--gold);
  text-decoration: none;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 700;
  margin-left: 6px;
  border-bottom: 1px solid var(--gold-dim);
  padding-bottom: 2px;
  transition: color var(--duration-fast) var(--easing);
}
.auth-bottom a:hover { color: var(--text); border-color: var(--gold); }

/* Little sigil under card */
.auth-sigil {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-dim);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 0.2em;
  opacity: 0.8;
}
.auth-sigil svg { width: 14px; height: 14px; color: var(--gold-dim); }
.auth-sigil::before, .auth-sigil::after {
  content: '';
  width: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-gold), transparent);
}

/* Responsive */
@media (max-width: 720px) {
  .corner-ornament { width: 60px; height: 60px; }
  .auth-card { padding: 60px 24px 32px; }
  .auth-logo { width: 90px; height: 90px; }
  .home-link { top: 16px; left: 20px; }
  .sso-row { grid-template-columns: 1fr; }
}
</style>
</head>

<!-- Ornements de coin -->
<svg class="corner-ornament tl"><use href="#i-corner"/></svg>
<svg class="corner-ornament tr"><use href="#i-corner"/></svg>
<svg class="corner-ornament bl"><use href="#i-corner"/></svg>
<svg class="corner-ornament br"><use href="#i-corner"/></svg>

<!-- Parallax glyphes gros (login = immersif) -->
<div class="parallax-layer" data-depth="0.15">
  <svg class="glyph gold" style="top:8%; left:6%; width:180px; height:180px;"><use href="#i-glyph-eye"/></svg>
  <svg class="glyph delay-1" style="top:12%; right:8%; width:220px; height:220px;"><use href="#i-glyph-pyramid"/></svg>

  <svg class="glyph delay-3" style="bottom:14%; right:14%; width:170px; height:170px;"><use href="#i-glyph-eye"/></svg>
</div>
<div class="parallax-layer" data-depth="0.32">
  <svg class="glyph delay-2" style="top:30%; left:22%; width:70px; height:70px;"><use href="#i-glyph-pyramid"/></svg>
  <svg class="glyph gold delay-1" style="top:70%; right:24%; width:90px; height:90px;"><use href="#i-glyph-ankh"/></svg>
</div>

</div>

<script>
const layers = document.querySelectorAll('.parallax-layer');
const prefersReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!prefersReduced) {
  let mx = 0, my = 0, ticking = false;
  addEventListener('mousemove', e => {
    mx = (e.clientX / innerWidth - 0.5) * 30;
    my = (e.clientY / innerHeight - 0.5) * 30;
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      layers.forEach(l => {
        const d = parseFloat(l.dataset.depth || 0.2);
        l.style.transform = `translate3d(${mx * d}px, ${my * d}px, 0)`;
      });
      ticking = false;
    });
  });
}
</script>
</body>
