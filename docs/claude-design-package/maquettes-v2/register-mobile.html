<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuGiOh Mobile · v2 · Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0906;
  --bg-elev: #14100A;
  --panel: #1A1510;
  --panel-2: #221B12;
  --border: #3A2E1C;
  --text: #F5EFE0;
  --text-muted: #A99C86;
  --gold: #F5C518;
  --gold-dim: #C29A0F;
  --gold-glow: rgba(245, 197, 24, 0.35);
  --violet: #A855F7;
  --violet-glow: rgba(168, 85, 247, 0.35);
  --cyan: #22D3EE;
  --success: #34D399;
  --danger: #FF4D6D;
  --easing: cubic-bezier(.2, .8, .2, 1);
  --duration-fast: 180ms;
  --duration-mid: 320ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  background: #000;
  color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif;
  overflow-x: hidden;
}
body {
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 70% 20%, rgba(168, 85, 247, 0.08), transparent 60%),
    radial-gradient(circle at 30% 80%, rgba(245, 197, 24, 0.05), transparent 60%),
    #000;
}

/* ═══ Device frame ═══ */
.device {
  position: relative;
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 44px;
  border: 1px solid rgba(245, 197, 24, 0.35);
  overflow: hidden;
  isolation: isolate;
  animation: framePulse 4s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { box-shadow: 0 0 30px rgba(245,197,24,0.10), inset 0 0 0 1px rgba(245,197,24,0.10); }
  50%     { box-shadow: 0 0 55px rgba(245,197,24,0.22), inset 0 0 0 1px rgba(245,197,24,0.20); }
}
@media (prefers-reduced-motion: reduce) {
  .device { animation: none; }
}
@media (max-width: 500px) {
  body { padding: 0; }
  .device { width: 100vw; height: 100vh; border-radius: 0; border: 0; animation: none; }
}

.notch {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  width: 120px; height: 30px; background: #000; border-radius: 20px; z-index: 200;
}
.home-bar {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 130px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 4px; z-index: 200;
}
.status-bar {
  position: absolute; top: 14px; left: 0; right: 0; padding: 0 32px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 150;
  font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: var(--text);
  pointer-events: none;
}
.status-bar .right { display: flex; gap: 6px; align-items: center; opacity: 0.85; font-size: 10px; }

.parallax {
  position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
}
.glyph {
  position: absolute; color: var(--violet); opacity: 0.10;
  animation: float 12s ease-in-out infinite;
}
.glyph.gold { color: var(--gold); opacity: 0.08; }
.glyph.delay-1 { animation-delay: -3s; }
@keyframes float {
  0%,100% { transform: translateY(0) rotate(0deg); }
  50%     { transform: translateY(-24px) rotate(6deg); }
}
@media (prefers-reduced-motion: reduce) {
  .glyph { animation: none; }
}

.corner {
  position: absolute; width: 56px; height: 56px;
  color: var(--gold); opacity: 0.5; z-index: 10; pointer-events: none;
}
.corner.tl { top: 44px; left: 12px; }
.corner.tr { top: 44px; right: 12px; transform: scaleX(-1); }
.corner.bl { bottom: 40px; left: 12px; transform: scaleY(-1); }
.corner.br { bottom: 40px; right: 12px; transform: scale(-1); }

.screen {
  position: absolute;
  inset: 48px 0 32px 0;
  padding: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  z-index: 5;
  overflow-y: auto;
}

.logo-wrap {
  margin-top: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: enter 700ms var(--easing) both;
}
@keyframes enter {
  from { opacity: 0; transform: translateY(-14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .logo-wrap { animation: none; }
}
.logo {
  width: 76px; height: 76px; color: var(--gold);
  filter: drop-shadow(0 0 12px var(--gold-glow));
  animation: breath 4s ease-in-out infinite;
}
@keyframes breath {
  0%,100% { filter: drop-shadow(0 0 8px var(--gold-glow)); }
  50%     { filter: drop-shadow(0 0 20px var(--gold-glow)); transform: scale(1.03); }
}
@media (prefers-reduced-motion: reduce) {
  .logo { animation: none; }
}
.brand-name {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text);
}
.brand-name .accent { color: var(--gold); }
.arcane {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 11px; letter-spacing: 0.28em; color: var(--gold-dim);
  text-transform: uppercase;
}

.title-block {
  margin-top: 22px;
  text-align: center;
  animation: enter 700ms var(--easing) both;
  animation-delay: 100ms;
}
.title {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text);
}
.subtitle {
  margin-top: 6px; font-size: 13px; color: var(--text-muted); letter-spacing: 0.04em;
}

.form {
  margin-top: 22px; width: 100%;
  display: flex; flex-direction: column; gap: 14px;
  animation: enter 700ms var(--easing) both;
  animation-delay: 200ms;
}
.field { position: relative; }
.field-label {
  font-family: 'Orbitron', sans-serif; font-size: 9px;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px; display: block;
}
.input {
  width: 100%; padding: 13px 16px;
  background: var(--panel);
  border: 1px solid var(--border); border-left: 3px solid var(--gold);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif; font-size: 15px;
  outline: none;
  transition: all var(--duration-fast) var(--easing);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
}
.input:focus {
  border-color: var(--gold); box-shadow: 0 0 0 2px rgba(245, 197, 24, 0.15);
}
.input::placeholder { color: var(--text-muted); opacity: 0.6; }

.hint {
  margin-top: 4px;
  display: flex; flex-direction: column; gap: 3px;
  font-size: 11px; color: var(--text-muted); letter-spacing: 0.02em;
}
.hint-row { display: flex; align-items: center; gap: 6px; }
.hint-row.ok { color: var(--success); }
.hint-row.ko { color: var(--text-muted); }
.hint-dot {
  width: 6px; height: 6px; background: currentColor;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  transform: rotate(45deg);
}

.cyber-btn {
  --main: var(--gold);
  --shadow: var(--violet);
  --fg: #0B0906;
  --clip: polygon(0 0, 100% 0, 100% 100%, 95% 100%, 95% 90%, 85% 90%, 85% 100%, 8% 100%, 0 70%);
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center; justify-content: center; gap: 8px;
  padding: 15px 24px;
  font-family: 'Orbitron', sans-serif;
  font-size: 12px; letter-spacing: 0.16em;
  font-weight: 700; text-transform: uppercase;
  color: var(--fg);
  background: transparent;
  border: 0; cursor: pointer;
  min-height: 50px;
  transition: transform var(--duration-fast) var(--easing), filter var(--duration-mid) var(--easing);
  margin-right: 5px;
  width: 100%;
}
.cyber-btn::before, .cyber-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  clip-path: var(--clip);
  z-index: -1;
}
.cyber-btn::before { background: var(--shadow); transform: translateX(5px); }
.cyber-btn::after { background: var(--main); }
.cyber-btn:hover { filter: brightness(1.1); }
.cyber-btn:active { transform: translate(2px, 1px); }
.cyber-btn.glitch:hover::after {
  animation: glitch 0.6s steps(4) infinite;
}
@keyframes glitch {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-1px, 1px); filter: hue-rotate(15deg); }
  50%  { transform: translate(1px, -1px); }
  75%  { transform: translate(-1px, -1px); filter: hue-rotate(-15deg); }
  100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .cyber-btn.glitch:hover::after { animation: none; }
}

.tos {
  text-align: center;
  font-size: 11px; color: var(--text-muted); letter-spacing: 0.02em;
  margin-top: 4px;
}
.tos a { color: var(--gold); text-decoration: none; }
.tos a:hover { text-decoration: underline; }

.back-login {
  margin-top: 20px;
  text-align: center;
  font-size: 13px; color: var(--text-muted);
  letter-spacing: 0.04em;
}
.back-login a {
  color: var(--gold); text-decoration: none; font-weight: 700;
  font-family: 'Orbitron', sans-serif; font-size: 11px;
  letter-spacing: 0.14em; text-transform: uppercase; margin-left: 6px;
}
.back-login a:hover { text-decoration: underline; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div class="device">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="currentColor"><rect x="0" y="4" width="2" height="6"/><rect x="4" y="2" width="2" height="8"/><rect x="8" y="0" width="2" height="10" opacity="0.6"/><rect x="12" y="0" width="2" height="10" opacity="0.3"/></svg>
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.5" y="0.5" width="14" height="9" rx="1.5"/><rect x="15.5" y="3" width="1.5" height="4" fill="currentColor"/><rect x="2" y="2" width="10" height="6" fill="currentColor"/></svg>
    </span>
  </div>

  <div class="parallax">
    <svg class="glyph gold" style="top:5%; right:-30px; width:170px; height:170px;"><use href="#i-glyph-ankh"/></svg>

      <button class="cyber-btn glitch" style="margin-top: 12px;">

      <p class="tos">En rejoignant, tu acceptes les <a href="#">CGU</a> et la <a href="#">confidentialité</a>.</p>

  <div class="home-bar"></div>

</body>
