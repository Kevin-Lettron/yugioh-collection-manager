<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuGiOh Mobile · v2 · Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0B0906;
  --panel: #1A1510;
  --border: #3A2E1C;
  --text: #F5EFE0;
  --text-muted: #A99C86;
  --gold: #F5C518;
  --gold-dim: #C29A0F;
  --gold-glow: rgba(245, 197, 24, 0.4);
  --violet: #A855F7;
  --cyan: #22D3EE;
  --easing: cubic-bezier(.2, .8, .2, 1);
  --duration-fast: 180ms;
  --duration-mid: 320ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh; background: #000; color: var(--text);
  font-family: 'Rajdhani', system-ui, sans-serif; overflow-x: hidden;
}
body {
  display: grid; place-items: center; padding: 24px;
  background: radial-gradient(circle at 30% 20%, rgba(168, 85, 247, 0.06), transparent 60%), #000;
}

.device {
  position: relative; width: 390px; height: 844px;
  background: #000; border-radius: 44px;
  border: 1px solid rgba(245, 197, 24, 0.35);
  overflow: hidden; isolation: isolate;
  animation: framePulse 4s ease-in-out infinite;
}
@keyframes framePulse {
  0%,100% { box-shadow: 0 0 30px rgba(245,197,24,0.10), inset 0 0 0 1px rgba(245,197,24,0.10); }
  50%     { box-shadow: 0 0 55px rgba(245,197,24,0.22), inset 0 0 0 1px rgba(245,197,24,0.20); }
}
@media (prefers-reduced-motion: reduce) { .device { animation: none; } }
@media (max-width: 500px) {
  body { padding: 0; }
  .device { width: 100vw; height: 100vh; border-radius: 0; border: 0; animation: none; }
}

.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #000; border-radius: 20px; z-index: 300; }
.home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 130px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 4px; z-index: 300; }
.status-bar {
  position: absolute; top: 14px; left: 0; right: 0; padding: 0 32px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 250; font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: var(--text);
  pointer-events: none;
}
.status-bar .right { display: flex; gap: 6px; align-items: center; opacity: 0.85; font-size: 10px; }

/* ═══ Camera preview (fond plein écran) ═══ */
.camera {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(30, 25, 20, 0.6), transparent 65%),
    linear-gradient(180deg, #0a0806 0%, #1a1108 40%, #050303 100%);
  z-index: 1;
  overflow: hidden;
}
/* Simulation de scanlines/noise pour effet "camera lo-light" */
.camera::before {
  content: ''; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,0.015) 3px 4px);
  pointer-events: none;
}
.camera::after {
  content: ''; position: absolute; inset: 0;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.08;
  mix-blend-mode: overlay;
  pointer-events: none;
  animation: grain 8s steps(6) infinite;
}
@keyframes grain {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-2%, -1%); }
  50% { transform: translate(1%, 2%); }
  75% { transform: translate(-1%, 1%); }
}
@media (prefers-reduced-motion: reduce) { .camera::after { animation: none; } }

/* ═══ Header transparent ═══ */
.header {
  position: absolute;
  top: 44px; left: 0; right: 0; height: 56px;
  padding: 0 12px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 100;
}
.icon-btn {
  width: 40px; height: 40px;
  border: 1px solid rgba(245, 197, 24, 0.5);
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(10px);
  color: var(--text); display: grid; place-items: center;
  cursor: pointer;
  transition: all var(--duration-fast) var(--easing);
  clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
}
.icon-btn:hover { border-color: var(--gold); color: var(--gold); }
.header-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 0 12px rgba(0,0,0,0.9);
}
.header-title-arcane {
  display: block;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 9px; letter-spacing: 0.28em; color: var(--gold);
  text-align: center;
  margin-top: 2px;
}
.header-spacer { width: 40px; }

/* ═══ Target zone: le cadre carte au centre ═══ */
.scan-area {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -52%);
  width: 240px;
  aspect-ratio: 59 / 86;
  z-index: 50;
}
/* Carte placeholder (simulation d'une carte YGO en preview) */
.scan-card-preview {
  position: absolute; inset: 0;
  background:
    linear-gradient(135deg, rgba(139, 90, 30, 0.35) 0%, rgba(50, 35, 15, 0.5) 100%);
  border: 1px solid rgba(245, 197, 24, 0.15);
  overflow: hidden;
  animation: cardPulse 3.5s ease-in-out infinite;
}
.scan-card-preview::before {
  content: '';
  position: absolute;
  top: 10%; left: 10%; right: 10%; height: 40%;
  background: linear-gradient(135deg, rgba(245, 197, 24, 0.12), rgba(168, 85, 247, 0.08));
  border: 1px solid rgba(245, 197, 24, 0.1);
}
.scan-card-preview::after {
  content: '';
  position: absolute;
  top: 55%; left: 10%; right: 10%; bottom: 15%;
  background:
    repeating-linear-gradient(0deg,
      rgba(245, 197, 24, 0.08) 0 2px,
      transparent 2px 8px);
}
@keyframes cardPulse {
  0%,100% { filter: brightness(1); }
  50%     { filter: brightness(1.2); }
}
@media (prefers-reduced-motion: reduce) { .scan-card-preview { animation: none; } }

/* Corners de lock */
.lock-corner {
  position: absolute;
  width: 32px; height: 32px;
  color: var(--gold);
  filter: drop-shadow(0 0 6px var(--gold-glow));
  animation: lockPulse 2s ease-in-out infinite;
}
.lock-corner.tl { top: -6px; left: -6px; }
.lock-corner.tr { top: -6px; right: -6px; transform: scaleX(-1); }
.lock-corner.bl { bottom: -6px; left: -6px; transform: scaleY(-1); }
.lock-corner.br { bottom: -6px; right: -6px; transform: scale(-1); }
@keyframes lockPulse {
  0%,100% { opacity: 0.85; filter: drop-shadow(0 0 4px var(--gold-glow)); }
  50%     { opacity: 1; filter: drop-shadow(0 0 12px var(--gold-glow)); }
}
@media (prefers-reduced-motion: reduce) { .lock-corner { animation: none; } }

/* Ligne de scan qui traverse (effet) */
.scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  box-shadow: 0 0 12px var(--gold);
  top: 0;
  animation: scanSweep 3s ease-in-out infinite;
  z-index: 51;
}
@keyframes scanSweep {
  0%   { top: 0%; opacity: 0; }
  15%  { opacity: 1; }
  85%  { opacity: 1; }
  100% { top: 100%; opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .scan-line { display: none; } }

/* ═══ Voiles sombres autour de la zone de scan ═══ */
.scan-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 40;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 20%, rgba(0,0,0,0.35) 80%, rgba(0,0,0,0.85) 100%);
}

/* ═══ Hint texte ═══ */
.hint {
  position: absolute;
  bottom: 260px;
  left: 0; right: 0;
  text-align: center;
  z-index: 60;
  padding: 0 40px;
}
.hint-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 0 12px rgba(0,0,0,0.9);
}
.hint-arcane {
  display: block;
  margin-top: 4px;
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 11px; letter-spacing: 0.24em; color: var(--gold-dim);
  text-transform: uppercase;
  opacity: 0.85;
}

/* ═══ Bouton capture ═══ */
.capture-wrap {
  position: absolute;
  bottom: 130px;
  left: 0; right: 0;
  display: flex; justify-content: center;
  z-index: 60;
}
.capture-btn {
  width: 75px; height: 75px;
  background: #fff;
  border: 3px solid var(--gold);
  cursor: pointer;
  position: relative;
  transition: transform var(--duration-mid) var(--easing);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  display: grid; place-items: center;
}
.capture-btn:hover { transform: scale(1.05); }
.capture-btn:active { transform: scale(0.94); }
.capture-btn::before {
  content: '';
  position: absolute;
  inset: -12px;
  border: 1px solid var(--gold);
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  animation: captureRing 2.2s ease-out infinite;
}
.capture-btn::after {
  content: '';
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dim));
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
@keyframes captureRing {
  0%   { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.6); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .capture-btn::before { animation: none; opacity: 0.3; } }

/* ═══ Mode selector row ═══ */
.mode-row {
  position: absolute;
  bottom: 56px;
  left: 0; right: 0;
  display: flex; justify-content: center; gap: 12px;
  z-index: 60;
  padding: 0 40px;
}
.mode-btn {
  padding: 8px 14px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'Orbitron', sans-serif;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  cursor: pointer;
  transition: all var(--duration-fast) var(--easing);
  clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 100%, 6px 100%);
  display: inline-flex; align-items: center; gap: 6px;
}
.mode-btn:hover { color: var(--text); border-color: var(--gold-dim); }
.mode-btn.active {
  background: rgba(245, 197, 24, 0.15);
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 12px var(--gold-glow);
}

/* Ornements ambiants aux coins (or subtil) */
.corner {
  position: absolute; width: 44px; height: 44px;
  color: var(--gold); opacity: 0.4; z-index: 30; pointer-events: none;
}
.corner.tl { top: 90px; left: 8px; }
.corner.tr { top: 90px; right: 8px; transform: scaleX(-1); }
.corner.bl { bottom: 30px; left: 8px; transform: scaleY(-1); }
.corner.br { bottom: 30px; right: 8px; transform: scale(-1); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter">
    <path d="M5 5 L19 19 M19 5 L5 19"/>
  </symbol>
  <symbol id="i-flash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="miter">
    <path d="M13 2 L4 14 L11 14 L10 22 L20 10 L13 10 Z"/>
  </symbol>
  <symbol id="i-lock-corner" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="miter">
    <path d="M2 12 L2 2 L12 2"/>
    <path d="M6 6 L6 6.5" stroke-width="3.5"/>
  </symbol>
  <symbol id="i-corner" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M0 0 L30 0 L30 3 L3 3 L3 30 L0 30 Z"/>
    <path d="M8 8 L22 8 M8 8 L8 22" opacity="0.4"/>
    <circle cx="8" cy="28" r="1.5" fill="currentColor"/>
    <circle cx="28" cy="8" r="1.5" fill="currentColor"/>
  </symbol>
  <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M3 4 H21 V20 H3 Z"/>
    <path d="M7 8 L7 16 M11 8 L11 16 M15 8 L15 16 M9 8 L9 12 M13 8 L13 16 M17 10 L17 14"/>
  </symbol>
  <symbol id="i-fullcard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter">
    <path d="M6 3 H18 V21 H6 Z"/>
    <path d="M9 7 H15 M9 11 H15 M9 15 H13"/>
  </symbol>
</svg>

<div class="device">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <span class="right">
      <svg width="16" height="10" viewBox="0 0 16 10" fill="currentColor"><rect x="0" y="4" width="2" height="6"/><rect x="4" y="2" width="2" height="8"/><rect x="8" y="0" width="2" height="10"/><rect x="12" y="0" width="2" height="10" opacity="0.5"/></svg>
      <svg width="18" height="10" viewBox="0 0 18 10" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.5" y="0.5" width="14" height="9" rx="1.5"/><rect x="15.5" y="3" width="1.5" height="4" fill="currentColor"/><rect x="2" y="2" width="10" height="6" fill="currentColor"/></svg>
    </span>
  </div>

  <!-- Camera preview -->
  <div class="camera"></div>

  <!-- Voiles sombres -->
  <div class="scan-overlay"></div>

  <!-- Header transparent -->
  <div class="header">
    <button class="icon-btn" title="Fermer"><svg width="18" height="18"><use href="#i-close"/></svg></button>
    <div>
      <div class="header-title">Scanner une carte</div>
      <span class="header-title-arcane">— rituel d'identification —</span>
    </div>
    <button class="icon-btn" title="Flash"><svg width="16" height="16"><use href="#i-flash"/></svg></button>
  </div>

  <svg class="corner tl"><use href="#i-corner"/></svg>
  <svg class="corner tr"><use href="#i-corner"/></svg>
  <svg class="corner bl"><use href="#i-corner"/></svg>
  <svg class="corner br"><use href="#i-corner"/></svg>

  <!-- Zone de scan -->
  <div class="scan-area">
    <div class="scan-card-preview"></div>
    <div class="scan-line"></div>
    <svg class="lock-corner tl"><use href="#i-lock-corner"/></svg>
    <svg class="lock-corner tr"><use href="#i-lock-corner"/></svg>
    <svg class="lock-corner bl"><use href="#i-lock-corner"/></svg>
    <svg class="lock-corner br"><use href="#i-lock-corner"/></svg>
  </div>

  <!-- Hint -->
  <div class="hint">
    <div class="hint-text">Cadre la carte dans le rectangle</div>
    <span class="hint-arcane">— aligne le sceau du Millénium —</span>
  </div>

  <!-- Capture -->
  <div class="capture-wrap">
    <button class="capture-btn" title="Capturer"></button>
  </div>

  <!-- Mode selector -->
  <div class="mode-row">
    <button class="mode-btn active">
      <svg width="12" height="12"><use href="#i-fullcard"/></svg>
      Carte entière
    </button>
    <button class="mode-btn">
      <svg width="12" height="12"><use href="#i-code"/></svg>
      Code
    </button>
  </div>

  <div class="home-bar"></div>
</div>

</body>
</html>
